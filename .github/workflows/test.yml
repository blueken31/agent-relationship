name: Test SDK

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: sdk-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package
        run: python -m pip install . --no-deps
      - name: Run deterministic tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s agent_relationship/tests -v
      - name: Run offline recovery example
        run: python examples/task_recovery.py
      - name: Verify restart recovery
        run: python examples/durable_recovery.py
      - name: Verify host task continuity
        run: python examples/host_task_recovery.py
      - name: Verify Agents API synthetic replay
        run: python examples/agents_api_replay.py
      - name: Validate collaboration evaluation and SDK wiring
        run: |
          python -m evaluation validate
          python -m evaluation selfcheck
          python examples/harness_sdk_policy.py
          python -m examples.evaluation_session
      - name: Render read-only task preview
        run: |
          python examples/task_review_preview.py --output /tmp/task-review.html
          cmp /tmp/task-review.html docs/task-review-preview.html
      - name: Check whitespace
        run: git diff --check
